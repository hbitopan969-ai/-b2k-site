<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitopan Official</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:black;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      width:100%;
      height:100%;
      background:linear-gradient(45deg,#ff0000,#000,#ff0000);
      animation:animate 6s linear infinite;
      filter:blur(90px);
      opacity:0.6;
    }

    @keyframes animate{
      0%{
        transform:rotate(0deg) scale(1);
      }
      50%{
        transform:rotate(180deg) scale(1.3);
      }
      100%{
        transform:rotate(360deg) scale(1);
      }
    }

    .card{
      position:relative;
      width:320px;
      padding:40px;
      border-radius:20px;
      text-align:center;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
      box-shadow:0 0 25px red;
    }

    h1{
      color:red;
      font-size:40px;
      margin-bottom:10px;
      text-shadow:0 0 20px red;
    }

    p{
      color:white;
      margin-bottom:25px;
      font-size:18px;
    }

    .btn{
      display:inline-block;
      padding:12px 30px;
      border-radius:30px;
      background:red;
      color:white;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:white;
      color:red;
      transform:scale(1.1);
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="card">
    <h1>BITOPAN</h1>

    <p>Welcome To My Official Website 🔥</p>

    <a href="#" class="btn">FOLLOW ME</a>
  </div>

</body>
</html>
